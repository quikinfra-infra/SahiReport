name: sahi_report
description: SahiReport — GPS verified field reporting for every project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ──────────────────────────────────────────────
  supabase_flutter: ^2.8.4

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^13.2.0

  # ── Image Handling ────────────────────────────────────────
  image_picker: ^1.1.2
  flutter_image_compress: ^2.2.0
  cached_network_image: ^3.3.1

  # ── GPS / Location ────────────────────────────────────────
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # ── Offline Queue ─────────────────────────────────────────
  sqflite: ^2.3.3
  path_provider: ^2.1.6
  path: ^1.9.0
  connectivity_plus: ^6.0.3

  # ── Payments ──────────────────────────────────────────────
  razorpay_flutter: ^1.3.6

  # ── Ads ───────────────────────────────────────────────────
  google_mobile_ads: ^5.1.0

  # ── Notifications ─────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2

  # ── PDF / Export ──────────────────────────────────────────
  pdf: ^3.12.0
  printing: ^5.13.1
  excel: ^4.0.3

  # ── UI Utilities ──────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  timeago: ^3.6.1
  intl: ^0.19.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # ── Secure Storage ────────────────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ── Utils ─────────────────────────────────────────────────
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  custom_lint: ^0.7.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/images/logo.png
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf

  fonts:
    # ── Poppins — English body + UI text ──────────────────
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

    # ── Hind — Hindi/Devanagari for सही ──────────────────
    - family: Hind
      fonts:
        - asset: assets/fonts/Hind-Regular.ttf
        - asset: assets/fonts/Hind-Medium.ttf
          weight: 500
        - asset: assets/fonts/Hind-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Hind-Bold.ttf
          weight: 700

# ── App Icon Configuration ────────────────────────────────
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/ic_launcher.png"
  adaptive_icon_background: "#1C315E" # Dark blue background matching your icon
  adaptive_icon_foreground: "assets/icons/ic_launcher.png"
  min_sdk_android: 21
  remove_alpha_ios: true